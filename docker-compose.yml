# Lokale Entwicklungsinfrastruktur. Nicht für Produktion.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onyx_owner
      POSTGRES_PASSWORD: onyx_owner_dev
      POSTGRES_DB: onyx
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
